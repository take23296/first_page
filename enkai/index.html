<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>宴会の仕込み帳</title>
<style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#23352e;background:#f5f5ee;font-synthesis:none}*{box-sizing:border-box}body{margin:0}header{background:#203d31;color:#fff;padding:25px max(6%,calc((100% - 1100px)/2)) 54px}.brand{font-size:13px;letter-spacing:.17em;color:#c8dfb5;font-weight:700}h1{font-size:clamp(27px,5vw,42px);margin:24px 0 8px;letter-spacing:.03em}header p{margin:0;color:#d6e4d6;line-height:1.7;font-size:14px}main{max-width:1100px;margin:-25px auto 50px;padding:0 20px}.layout{display:grid;grid-template-columns:340px 1fr;gap:20px;align-items:start}.card{background:#fff;border:1px solid #e4e9de;border-radius:16px;box-shadow:0 8px 24px #23352e0b;padding:24px}.eyebrow{font-size:11px;letter-spacing:.15em;color:#718879;font-weight:bold}h2{font-size:20px;margin:6px 0 22px}.field{margin:22px 0}.field label,.label{display:block;font-size:13px;font-weight:700;margin-bottom:9px}.hint{font-size:12px;color:#78877d;margin:7px 0 0;line-height:1.6}input,select,button{font:inherit}input[type=date],input[type=number],select{width:100%;padding:12px;border:1px solid #d6e0d7;border-radius:8px;background:white;color:#23352e}input[type=range]{width:100%;accent-color:#4f795c}.people{display:flex;align-items:center;gap:10px}.people input[type=number]{width:100px;font-size:20px;font-weight:700}.range-label{display:flex;justify-content:space-between;color:#89978d;font-size:11px}.courses{display:grid;gap:8px}.course{position:relative}.course input{position:absolute;opacity:0}.course label{display:flex;justify-content:space-between;align-items:center;border:1px solid #dbe4db;border-radius:9px;padding:12px;cursor:pointer;font-size:14px;font-weight:700}.course input:checked+label{border:2px solid #578366;background:#f0f7ee;padding:11px}.course input:focus-visible+label{outline:3px solid #9dc9a5}.course small{font-weight:400;color:#78877d}.result-head{display:flex;justify-content:space-between;align-items:start;gap:12px}.badge{background:#eef5e9;color:#4c7353;font-size:12px;padding:7px 10px;border-radius:30px;white-space:nowrap}.summary{background:#f3f7ee;border-radius:12px;padding:18px;margin-bottom:23px}.summary-top{font-size:12px;color:#68806b;font-weight:700}.deadline{font-size:24px;font-weight:800;margin:6px 0}.status{font-size:13px;line-height:1.5}.status.urgent{color:#b14e33}.table-title{display:flex;justify-content:space-between;align-items:baseline;gap:10px}.table-title h3{font-size:16px;margin:0}.table-title span{font-size:12px;color:#89978d}table{width:100%;border-collapse:collapse;margin-top:12px}th,td{text-align:left;padding:14px 5px;border-bottom:1px solid #edf0eb;font-size:14px}th{font-size:11px;color:#87978a}td:last-child,th:last-child{text-align:right}td:last-child{font-size:17px;font-weight:700;color:#315d41}.note{background:#fbf8ef;border-radius:10px;padding:14px;font-size:12px;color:#776c50;line-height:1.7;margin-top:22px}.print{width:100%;border:1px solid #cbd9ce;color:#315d41;background:#fff;border-radius:8px;padding:12px;margin-top:18px;font-weight:700;cursor:pointer}.print:hover{background:#f2f8f2}footer{text-align:center;font-size:12px;color:#92a095;margin-top:28px}@media(max-width:700px){header{padding:22px 20px 50px}.layout{grid-template-columns:1fr}.card{padding:20px}h1{margin-top:18px}.result-head h2{margin-bottom:18px}}@media print{header{padding:10px;color:#000;background:#fff}header p,.brand,.controls,.print,footer{display:none}main{margin:0;padding:0}.layout{display:block}.card{box-shadow:none;border:0}}
</style>
</head>
<body><header><div class="brand">ENKAI / PREPARATION NOTE</div><h1>宴会の仕込み帳</h1><p>予約が入ったら、まずはここから。<br>人数とコースに合わせた仕込みの目安をまとめます。</p></header>
<main><div class="layout"><section class="card controls" aria-labelledby="input-title"><div class="eyebrow">01 / RESERVATION</div><h2 id="input-title">予約の内容</h2><div class="field"><label for="date">宴会の日</label><input id="date" type="date"><p class="hint">発注期限の計算に使います</p></div><div class="field"><label for="people">予約人数</label><div class="people"><input id="people" type="number" min="1" max="200" value="20" inputmode="numeric"><span>名</span></div><input id="slider" type="range" min="1" max="200" value="20" aria-label="予約人数を調整"><div class="range-label"><span>1名</span><span>200名</span></div></div><fieldset class="field" style="border:0;padding:0"><legend class="label">コースを選ぶ</legend><div class="courses"><div class="course"><input type="radio" name="course" id="standard" value="standard" checked><label for="standard"><span>定番コース</span><small>バランスよく</small></label></div><div class="course"><input type="radio" name="course" id="meat" value="meat"><label for="meat"><span>お肉たっぷりコース</span><small>お肉が主役</small></label></div><div class="course"><input type="radio" name="course" id="fish" value="fish"><label for="fish"><span>海鮮コース</span><small>魚介が主役</small></label></div></div></fieldset><div class="field"><label for="lead">卸への発注リードタイム</label><select id="lead"><option value="1">前日まで</option><option value="2" selected>2日前まで</option><option value="3">3日前まで</option><option value="7">7日前まで</option></select><p class="hint">営業日・締切時刻は卸先にご確認ください</p></div></section>
<section class="card" aria-live="polite"><div class="result-head"><div><div class="eyebrow">02 / PREPARATION</div><h2>仕込みの目安</h2></div><span class="badge" id="badge"></span></div><div class="summary"><div class="summary-top">卸への発注期限</div><div class="deadline" id="deadline"></div><div class="status" id="status"></div></div><div class="table-title"><h3>食材リスト</h3><span>人数 × 1人あたりの目安</span></div><table><thead><tr><th>食材</th><th>1人あたり</th><th>必要量</th></tr></thead><tbody id="ingredients"></tbody></table><div class="note">※ 分量は仮の目安です。実際の献立、歩留まり、在庫、アレルギーに合わせて調整してください。発注期限は暦日で計算しています。</div><button class="print" type="button" onclick="window.print()">この内容を印刷する</button></section></div><footer>宴会の準備を、すこし軽やかに。</footer></main>
<script>
const courses={standard:{name:'定番コース',items:[['鶏肉',150],['魚介',80],['野菜',200],['米（乾燥）',80],['豆腐',80]]},meat:{name:'お肉たっぷりコース',items:[['牛肉',150],['鶏肉',120],['野菜',200],['米（乾燥）',100],['きのこ',60]]},fish:{name:'海鮮コース',items:[['鮮魚',160],['えび・貝類',100],['野菜',180],['米（乾燥）',80],['豆腐',80]]}};
const $=id=>document.getElementById(id),date=$('date'),people=$('people'),slider=$('slider');
function localDate(d){return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')}
const initial=new Date();initial.setDate(initial.getDate()+7);date.value=localDate(initial);
function render(){const n=Math.max(1,Math.min(200,Number(people.value)||1));const course=courses[document.querySelector('input[name="course"]:checked').value];$('badge').textContent=`${n}名・${course.name}`;$('ingredients').innerHTML=course.items.map(([name,grams])=>{const total=grams*n;return `<tr><td>${name}</td><td>${grams} g</td><td>${total>=1000?(total/1000).toLocaleString('ja-JP',{maximumFractionDigits:2})+' kg':total+' g'}</td></tr>`}).join('');const status=$('status');if(!date.value){$('deadline').textContent='日付を選択してください';status.textContent='';return}const d=new Date(date.value+'T00:00:00');d.setDate(d.getDate()-Number($('lead').value));$('deadline').textContent=new Intl.DateTimeFormat('ja-JP',{year:'numeric',month:'long',day:'numeric',weekday:'short'}).format(d);const today=new Date();today.setHours(0,0,0,0);const days=Math.round((d-today)/86400000);status.textContent=days<0?'発注期限を過ぎています。卸先にご確認ください。':days===0?'発注期限は今日です。':`発注期限まであと ${days} 日`;status.classList.toggle('urgent',days<=0)}
people.addEventListener('input',()=>{slider.value=people.value;render()});people.addEventListener('change',()=>{people.value=Math.max(1,Math.min(200,Math.round(Number(people.value)||1)));slider.value=people.value;render()});slider.addEventListener('input',()=>{people.value=slider.value;render()});document.querySelectorAll('input[name="course"], #date, #lead').forEach(el=>el.addEventListener('change',render));render();
</script></body></html>
